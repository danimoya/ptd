# Self-host: `cp .env.example .env`, set DB_PASSWORD, JWT_SECRET and PTD_SECRET_KEY, then
# `docker compose up -d --build`. PTD listens on http://localhost:3001; put your TLS proxy in front.
#
# Transport security between app and database: TLS with the X25519MLKEM768 post-quantum hybrid
# key exchange (HeliosDB-Nano ≥ 4.40, Node 24 / OpenSSL 3.5), certificate pinned via the shared
# /tls volume, SCRAM-SHA-256 authentication, AES-256-GCM encryption at rest when DB_ENCRYPTION_KEY
# is set. The database is not reachable from outside the compose network.
services:
  ptd-db:
    build:
      context: ./db/image
      args:
        NANO_VERSION: ${NANO_VERSION:-4.40.0}
    image: ptd-db:${NANO_VERSION:-4.40.0}
    container_name: ptd-db
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
    volumes:
      - ptd_db_data:/data
      - ptd_db_tls:/tls
    networks: [ptd-internal]

  ptd:
    build: .
    image: ptd:latest
    container_name: ptd
    restart: unless-stopped
    env_file: ${PTD_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@ptd-db:5432/heliosdb
      DATABASE_SSL: "true"
      DATABASE_SSL_CA: /tls/server.crt
      PORT: "3001"
      PTD_FILES_DIR: /data/files
    volumes:
      - ptd_db_tls:/tls:ro
      - ptd_files:/data/files
    ports:
      - "${PTD_PORT:-3001}:3001"
    depends_on: [ptd-db]
    networks: [ptd-internal]

  # Nightly dumps, off unless you ask for them:
  #   docker compose --profile backup up -d ptd-backup
  #
  # Same image as the database, so the dump is written by exactly the engine that
  # wrote the data. It mounts the data volume read-only, copies it, dumps the copy
  # and deletes the copy — HeliosDB-Nano 4.40 cannot dump a directory the server has
  # open, and its own --dump-schedule is not implemented yet (the script's header has
  # the verbatim messages). Nothing is stopped and nothing is written to /data.
  #
  # `scripts/restore.sh --input <file> --scratch --yes` rehearses a restore into a
  # throwaway container; docs/self-hosting.md walks through it.
  ptd-backup:
    profiles: [backup]
    image: ptd-db:${NANO_VERSION:-4.40.0}
    container_name: ptd-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/ptd-backup", "--cron"]
    environment:
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-17 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_COMPRESSION: ${BACKUP_COMPRESSION:-gzip}
      BACKUP_VERIFY: ${BACKUP_VERIFY:-0}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/ptd-backup:ro
      - ptd_db_data:/data:ro
      - ptd_db_tls:/tls:ro
      - ptd_files:/files:ro
      - ptd_backups:/backups
    depends_on: [ptd-db]
    networks: [ptd-internal]

volumes:
  ptd_db_data:
  ptd_db_tls:
  ptd_files:
  ptd_backups:

networks:
  ptd-internal:
    driver: bridge
